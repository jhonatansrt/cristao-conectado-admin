<app-dialog title="Alterar foto do perfil" (close)="onClose()">
  <section class="flex flex-column">
    @for (option of options; track option.title) {
      <app-card
        [title]="option.title"
        [description]="null"
        [icons]="option.icons"
        [clickable]="true"
      />
    }
  </section>
</app-dialog>
