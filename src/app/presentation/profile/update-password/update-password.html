<app-modal title="Alterar senha">
  <section class="body-modal">
    <form class="flex flex-column" [formGroup]="updatePasswordForm">
      <app-input label="Senha atual" type="password" formControlName="password" />
      <app-input label="Nova senha" type="password" formControlName="newPassword" />
      <app-input label="Confirme a senha" type="password" formControlName="newPasswordConfirmation" />
    </form>
  </section>

  <footer class="flex justify-end">
    <app-button btnClass="btn-secondary" (click)="closeModal()">Cancelar</app-button>
    <app-button btnClass="btn-primary" [loading]="isLoading" (click)="onConfirm()">Alterar</app-button>
  </footer>
</app-modal>
