<app-dialog title="Vincular membros" (close)="onClose()">
  <section class="flex flex-column">
    <app-autocomplete
      placeholder="Buscar membro..."
      [options]="memberOptions"
      [clearOnSelect]="true"
      (optionSelected)="onSelectMember($event)"
    >
      <ng-template let-option>
        <app-member-item [member]="$any(option.data)" />
      </ng-template>
    </app-autocomplete>

    @if (selectedMembers.length) {
      <ul class="selected flex flex-column">
        @for (member of selectedMembers; track member.id) {
          <li>
            <app-member-item
              [member]="member"
              [removable]="true"
              (remove)="onRemoveMember(member)"
            />
          </li>
        }
      </ul>
    }

    <footer class="flex justify-end">
      <app-button btnClass="btn-secondary" (click)="onCloseAll()">Fechar</app-button>
      <app-button btnClass="btn-primary" (click)="onConfirm()">Continuar</app-button>
    </footer>
  </section>
</app-dialog>
