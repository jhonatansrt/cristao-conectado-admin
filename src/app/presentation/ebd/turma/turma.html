<article class="flex flex-column">
  <app-segment [options]="options" [selected]="selected()" (selectedChange)="onSelect($event)" />

  @switch (selected()) {
    @case ('alunos') {
      @if (isLoading() || hasRows()) {
        <app-table />
      } @else {
        <app-empty-case description="Nenhum aluno cadastrado até o momento." icon="group" />
      }
    }
    @case ('licoes') {
      @if (isLoading() || hasRows()) {
        <app-table />
      } @else {
        <app-empty-case description="Nenhuma lição cadastrada até o momento." icon="menu_book" />
      }
    }
  }
</article>
