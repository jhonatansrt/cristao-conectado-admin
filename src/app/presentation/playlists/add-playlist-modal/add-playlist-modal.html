<app-modal [title]="playlistData ? 'Editar playlist' : 'Nova playlist'">
  <section class="body-modal">
    <form class="flex flex-column" [formGroup]="addPlaylistForm" (ngSubmit)="onConfirm()">
      <app-input
        label="Título"
        placeholder="Ex: Pregações"
        formControlName="title"
        [errorMessage]="
          addPlaylistForm.controls.title.touched && addPlaylistForm.controls.title.hasError('required')
            ? 'Título é obrigatório'
            : ''
        "
      />

      <app-input
        label="Ordem de exibição"
        type="number"
        formControlName="order"
        [errorMessage]="
          addPlaylistForm.controls.order.touched && addPlaylistForm.controls.order.hasError('required')
            ? 'Ordem de exibição é obrigatória'
            : addPlaylistForm.controls.order.touched && addPlaylistForm.controls.order.hasError('min')
              ? 'Ordem de exibição deve ser no mínimo 1'
              : addPlaylistForm.controls.order.touched && addPlaylistForm.controls.order.hasError('max')
                ? 'Ordem de exibição deve ser no máximo ' + maxOrder()
                : ''
        "
      />
    </form>
  </section>

  <footer class="flex justify-end">
    <app-button btnClass="btn-secondary" (click)="closeModal()">Cancelar</app-button>
    <app-button btnClass="btn-primary" [disabled]="addPlaylistForm.invalid" [loading]="loading" (click)="onConfirm()">
      Confirmar
    </app-button>
  </footer>
</app-modal>
