<app-modal title="Esqueceu a senha">
  <section class="body-modal">
    <form class="flex flex-column" aria-label="Formulário de recuperação de senha">
      <app-input label="Email" type="email" placeholder="Ex: joao@email.com" />
    </form>
  </section>

  <footer class="flex justify-end">
    <app-button btnClass="btn-secondary" (click)="closeModal()">Cancelar</app-button>
    <app-button btnClass="btn-primary">Confirmar</app-button>
  </footer>
</app-modal>
