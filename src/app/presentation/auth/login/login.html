<main class="flex justify-center items-center">
  <section class="flex flex-column items-center">
    <header>
      <img src="../../../../assets/logo.png" />
    </header>

    <form class="flex flex-column" aria-label="Formulário de login">
      <app-input label="E-mail" placeholder="" />

      <div>
        <app-input label="Senha" type="password" placeholder="" />
        <a href="#" (click)="openForgotPassword($event)">Esqueceu a senha?</a>
      </div>

      <app-button btnClass="btn-primary">Entrar</app-button>
    </form>

    <footer>
      <p (click)="openCreateAccount($event)">Não tem conta? <a>cadastre-se</a></p>
    </footer>
  </section>
</main>
