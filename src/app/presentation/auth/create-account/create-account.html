<app-modal title="Criar conta">
  <section class="body-modal">
    <form class="flex flex-column" aria-label="Formulário de criação de conta">
      <app-input label="Nome completo" />
      <app-input label="Email" type="email" />
      <app-input label="Data de nascimento" type="date" />
      <app-input label="Senha" type="password" />
      <app-input label="Confirmar senha" type="password" />
    </form>
  </section>
  <footer class="flex flex-column">
    <app-button btnClass="btn-primary">Criar conta</app-button>
    <app-button btnClass="btn-secondary">Cancelar</app-button>
  </footer>
</app-modal>
