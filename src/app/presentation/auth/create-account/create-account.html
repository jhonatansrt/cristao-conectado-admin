<app-modal title="Criar conta">
  <form class="flex flex-column" aria-label="Formulário de criação de conta">
    <app-input label="Nome completo" />
    <app-input label="Email" type="email" />

    <app-input label="Confirmar senha" type="password" />
  </form>
</app-modal>
