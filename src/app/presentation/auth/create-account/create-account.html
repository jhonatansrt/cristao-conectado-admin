<main class="flex justify-center items-center">
  <section>
    <header>
      <h1>Criar conta</h1>
    </header>

    <form class="flex flex-column" aria-label="Formulário de criação de conta">
      <app-input label="Nome completo" placeholder="Ex: João Silva" />
      <app-input label="Email" type="email" placeholder="Ex: joao@email.com" />
      <app-input label="Data de nascimento" type="date" placeholder="" />
      <app-input label="Senha" type="password" placeholder="Mínimo 8 caracteres" />
      <app-input
        label="Confirmar senha"
        type="password"
        placeholder="Digite a senha novamente"
      />
    </form>
  </section>
</main>
