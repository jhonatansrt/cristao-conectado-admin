<fieldset class="flex flex-column">
  <label>Dias da semana</label>
  <div class="flex flex-wrap justify-between">
    @for (day of days; track day.value) {
      <button
        type="button"
        [attr.aria-pressed]="isDaySelected(day.value)"
        (click)="toggle(day.value)"
      >
        {{ day.label }}
      </button>
    }
  </div>
</fieldset>
