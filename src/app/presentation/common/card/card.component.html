<article class="flex items-center justify-between">
  <div class="flex flex-column">
    <h3>{{ title() }}</h3>
    <p>{{ description() }}</p>
  </div>

  @if (icons().length) {
    <menu class="flex items-center">
      @for (icon of icons(); track $index) {
        <li class="flex">
          <mat-icon (click)="icon.action()">{{ icon.name }}</mat-icon>
        </li>
      }
    </menu>
  }
</article>
