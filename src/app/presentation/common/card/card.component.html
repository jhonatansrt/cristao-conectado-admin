<article [style.borderRadius]="borderRadius()" [style.cursor]="clickable() ? 'pointer' : null" class="flex items-center justify-between">
  <div class="flex flex-column">
    <h3>{{ title() }}</h3>

    @if (description()) {
      <p>{{ description() }}</p>
    }
  </div>

  @if (icons().length) {
    <menu class="flex items-center" (click)="$event.stopPropagation()">
      @for (icon of icons(); track $index) {
        <li class="flex">
          <mat-icon (click)="icon.action()">{{ icon.name }}</mat-icon>
        </li>
      }
    </menu>
  }
</article>
