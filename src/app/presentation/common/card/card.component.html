<article>
  <header class="flex items-center">
    <h3>{{ title() }}</h3>
    <p>{{ description() }}</p>
  </header>

  @if (icons().length) {
    <menu class="flex items-center">
      @for (icon of icons(); track $index) {
        <li>
          <mat-icon (click)="icon.action()">{{ icon.name }}</mat-icon>
        </li>
      }
    </menu>
  }
</article>
