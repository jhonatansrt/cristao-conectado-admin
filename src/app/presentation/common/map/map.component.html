<app-dialog [title]="readOnly() ? 'Local do Evento' : 'Confirmar endereço'" (close)="onClose()">
  <section>
    <div #mapContainer role="application" aria-label="Mapa para seleção de endereço"></div>

    <figure aria-hidden="true">
      <mat-icon>location_on</mat-icon>
    </figure>

    @if (!readOnly()) {
      <footer class="flex justify-center">
        <app-button btnClass="btn-primary" (click)="onConfirm()"> Confirmar endereço </app-button>
      </footer>
    }
  </section>
</app-dialog>
