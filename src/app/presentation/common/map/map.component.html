<app-dialog (close)="onClose()">

    <figure aria-hidden="true">
      <mat-icon>location_on</mat-icon>

    <footer class="flex justify-center">
      <app-button btnClass="btn-primary" (click)="onConfirm()"> Confirmar endereço </app-button>
    </footer>
  </section>
</app-dialog>
