<fieldset class="flex flex-column">
  <label>{{ label() }}</label>
  <input
    [type]="type()"
    [value]="value()"
    [placeholder]="placeholder()"
    (input)="onInput($event)"
    [appDateOfBirthMask]="dateOfBirth()"
  />

  @if (errorMessage()) {
    <small>{{ errorMessage() }}</small>
  }
</fieldset>
