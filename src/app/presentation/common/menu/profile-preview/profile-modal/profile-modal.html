<app-modal title="Perfil">
  <section class="body-modal flex flex-column">

    <div class="user-info flex flex-column items-center">
      <figure class="flex justify-center items-center">
        <mat-icon aria-hidden="true">person</mat-icon>
      </figure>
      <p>{{ userLogged()?.name | capitalizeName }}</p>
    </div>

    <div class="flex flex-column items-list">
      @for (item of menuItems; track item.title) {
        <div role="button" tabindex="0" (click)="item.click()" (keydown.enter)="item.click()">
          <app-card [title]="item.title" [description]="null" [icons]="item.icons" [clickable]="true" />
        </div>
      }
    </div>

  </section>
</app-modal>
