<section>
  <header
    role="button"
    tabindex="0"
    [attr.aria-expanded]="isOpen()"
    (click)="toggle()"
    (keydown.enter)="toggle()"
    (keydown.space)="toggle(); $event.preventDefault()"
  >
    <app-card
      [title]="title()"
      [description]="isOpen() ? null : description()"
      [icons]="headerIcons()"
      [borderRadius]="isOpen() ? '8px 8px 0 0' : '8px'"
    />
  </header>

  @if (isOpen()) {
    <article>
      <ng-content></ng-content>
    </article>
  }
</section>
