<section class="flex flex-column">
  <h3>Membros ativos vs. inativos</h3>

  <figure class="flex justify-center">
    <canvas #chartCanvas></canvas>
  </figure>

  <footer class="flex justify-center">
    <span class="flex items-center">
      <i [style.background]="active.color"></i>
      Ativos
    </span>
    <span class="flex items-center">
      <i [style.background]="inactive.color"></i>
      Inativos
    </span>
  </footer>

  <ul class="flex justify-center">
    <li class="flex flex-column items-center">
      <strong [style.color]="active.color">{{ active.count }}</strong>
      <span>Ativos</span>
      <small>{{ active.percentage }}.0%</small>
    </li>
    <li class="flex flex-column items-center">
      <strong [style.color]="inactive.color">{{ inactive.count }}</strong>
      <span>Inativos</span>
      <small>{{ inactive.percentage }}.0%</small>
    </li>
  </ul>
</section>
