<app-modal title="Endereço">
  <section class="body-modal flex flex-column">
    <app-input label="Novo endereço" (valueChange)="onSearchAddress($event)" />

    <app-predictions [predictions]="predictions" (confirmed)="onAddressCreated()" />

    @if (shouldShowRegisteredAddresses) {
      <div class="flex flex-column">
        <h3>Selecionar existente</h3>

        @if (addressesStore.isLoading()) {
          @for (skeleton of [1, 2, 3]; track skeleton) {
            <article class="flex items-center justify-between">
              <div class="flex flex-column">
                <app-skeleton width="40%" height="16px" />
                <app-skeleton width="65%" height="14px" />
              </div>
              <menu class="flex items-center">
                <li><app-skeleton width="20px" height="20px" /></li>
                <li><app-skeleton width="20px" height="20px" /></li>
              </menu>
            </article>
          }
        } @else {
          @for (address of addressesStore.addresses(); track address.id) {
            <app-card
              [title]="address.place"
              [description]="getAddressDescription(address)"
              [icons]="getCardActions(address)"
              (click)="onSelectAddress(address)"
            />
          }
        }
      </div>
    }
  </section>
</app-modal>
