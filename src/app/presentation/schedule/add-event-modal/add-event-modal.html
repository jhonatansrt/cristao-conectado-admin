<app-modal title="Novo evento">
  <section class="body-modal flex flex-column">
    <fieldset class="flex flex-column">
      <label>Endereço</label>
      <app-card
        [title]="currentAddress()?.place ?? ''"
        [description]="addressDescription()"
        [icons]="[{ name: 'edit', action: onChangeAddress.bind(this) }]"
      />
    </fieldset>

    <form class="flex flex-column" [formGroup]="form">
      <div class="flex">
        <app-input
          label="Título"
          placeholder="Ex: Culto"
          formControlName="title"
          [errorMessage]="
            form.controls.title.touched && form.controls.title.hasError('required')
              ? 'Título é obrigatório'
              : ''
          "
        />
        <app-select
          label="Evento fixo"
          formControlName="isFixed"
          [options]="[{ label: 'Não', value: 'false' }, { label: 'Sim', value: 'true' }]"
        />
      </div>

      <div class="flex">
        @if (isFixed) {
          <app-select
            label="Dia da semana"
            formControlName="dayOfWeek"
            [options]="daysOfWeek"
          />
        } @else {
          <app-input label="Data" type="date" formControlName="date" />
        }
      </div>

      <div class="flex">
        <app-input label="Início" type="time" formControlName="startTime" />
        <app-input label="Fim" type="time" formControlName="endTime" />
      </div>

      <fieldset class="flex flex-column">
        <label>Descrição</label>
        <textarea formControlName="description" placeholder="Descreva o evento..."></textarea>
      </fieldset>
    </form>
  </section>

  <footer class="flex justify-end">
    <app-button btnClass="btn-secondary" (click)="onCancel()">Cancelar</app-button>
    <app-button btnClass="btn-primary" [loading]="loading" (click)="onConfirm()"
      >Confirmar</app-button
    >
  </footer>
</app-modal>
