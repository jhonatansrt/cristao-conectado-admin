<article class="flex flex-column">
  <app-church-data #churchData />

  <div class="buttons-actions flex items-center justify-end">
    <app-button
      (click)="churchData.sendChurch()"
      btnClass="btn-primary"
      [disabled]="churchData.isButtonDisabled"
      [loading]="churchData.isLoading"
      >{{ churchData.hasChurch ? 'Atualizar Igreja' : 'Criar Igreja' }}</app-button
    >
  </div>
</article>
