<article class="flex flex-column">
  <app-church-data
    [form]="form"
    [churchTypes]="churchTypes"
    [currentAddress]="currentAddress"
    [addressDescription]="addressDescription()"
    [churchAvatar]="churchAvatar"
    [churchBanner]="churchBanner"
    [uploadingPhoto]="uploadingPhoto"
    [uploadingBanner]="uploadingBanner"
    (openFilePickerAvatarClick)="openFilePickerAvatar()"
    (openFilePickerBannerClick)="openFilePickerBanner()"
    (openAddressClick)="openAddress()"
  />

  <app-social-media [form]="form" />

  <div class="buttons-actions flex items-center justify-end">
    <app-button
      (click)="sendChurch()"
      btnClass="btn-primary"
      [disabled]="isButtonDisabled"
      [loading]="isLoading"
      >{{ hasChurch ? 'Atualizar Igreja' : 'Criar Igreja' }}</app-button
    >
  </div>
</article>
