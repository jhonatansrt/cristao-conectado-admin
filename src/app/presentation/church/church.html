<div class="church flex flex-column">
  <section class="flex flex-column">
    <h2>Dados da igreja</h2>

    <div class="images flex items-center">
      <div class="avatar flex justify-center items-center">
        <mat-icon>person</mat-icon>
        <button class="flex justify-center items-center">
          <mat-icon>photo_camera</mat-icon>
        </button>
      </div>

      <div class="banner flex justify-center items-center">
        <span>Banner da Igreja</span>
      </div>
    </div>

    <form class="flex flex-column" >
      <div class="flex">
        <app-input label="Nome"           
          placeholder="Ex: Igreja Batista Transcoqueiro"
          formControlName="name"
          [errorMessage]="
            form.controls.name.touched && form.controls.name.hasError('required')
              ? 'Nome é obrigatório'
              : ''
          " />
        <app-input label="Telefone"           
          placeholder="Ex: 99999999999"
          formControlName="phone"
          [errorMessage]="
            form.controls.phone.touched && form.controls.phone.hasError('required')
              ? 'Telefone é obrigatório'
              : ''
          " />
        <app-select
          label="Denominação"
          formControlName="type_id"
          [options]="chuchType"
          [optionSelected]="chuchType.value"
        />
      </div>
      <app-input label="Endereço" value="Icuí-guajará, Ananindeua - PA" />
    </form>
  </section>

  <section class="flex flex-column">
    <h2>Redes sociais</h2>

    <form class="flex flex-column">
      <div class="flex">
        <app-input label="Instagram" 
          placeholder="https://www.instagram.com/igreja"
          formControlName="instagram" />

        <app-input label="Facebook" 
          placeholder="https://www.facebook.com/igreja" 
          formControlName="instagram" />
      </div>
      <div class="flex">
        <app-input label="YouTube"
          placeholder="https://www.youtube.com/igreja"
          formControlName="instagram" />
      </div>
    </form>
  </section>
</div>
